<!doctype html>
<html lang="en">

<head> 
    <title>Number Mapping Task</title>
    <meta charset="UTF-8">

    <script src="https://unpkg.com/jspsych@7.2.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script> <!-- Fixed typo -->
    <link href="https://unpkg.com/jspsych@7.1.2/css/jspsych.css" rel="stylesheet" type="text/css" />

    <!-- Pavlovia plugin (Required if RUN_ON_PAVLOVIA is true) -->
    <script type="text/javascript" src="lib/jspsych-7-pavlovia-2022.1.1.js"></script>


<style>

    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        background: #bdbdbd; 
        margin: 0;
    }

    .jspsych-display-element {
        background: #bdbdbd;
        color: #fff;
        height: 100%;
    }

    .jspsych-content {
        color: #fff;
    }


    .jspsych-content-wrapper {
        height: 100%;
    }

    #tswitch-stim-wrap {
        position: relative;
        width: 260px;
        height: 260px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #tswitch-cue {
        position: relative;
        font-size: 90px;
        font-family: Arial;
        color: #fff;
    }

    .tswitch-instructions {
        max-width: 720px;
        margin: 0 auto;
        text-align: left;
        font-size: 20px;
        line-height: 1.5;
    }

    .tswitch-key {
        display: inline-block;
        border: 2px solid #fff;
        border-radius: 6px;
        padding: 2px 12px;
        font-weight: bold;
        margin: 0 4px;
    }
</style>
</head>

<body></body>

<script src="task.js"></script>
<script>

const RUN_ON_PAVLOVIA = true; // set to true to run on pavlovia; false for local testing
const TRIAL_DURATION_MS = 1500; // Fixed trial duration, participants must respond within 1,500 ms
const FIXATION_MS = 500; // Fixed fixation duration 
const jsPsych = initJsPsych({
    on_finish: function() {
        if (!RUN_ON_PAVLOVIA) {
            const now = new Date();
            const dateStr = now.toISOString().slice(0,10); 
            const timeStr = now.toTimeString().slice(0,8).replace(/:/g, "-");

            // For local runs, download to local disc
            jsPsych.data.get().localSave("csv", "task_switching_data${dateStr}_${timeStr}.csv"); 
        }
    }
});

const timeline = [];

// Organize participant information
// This is an online task and the participant ID will be produced by %SURVEY_CODE% in SONA
// $SURVEY_CODE% will be passed to participantID and to external survey software (REDcap)

//===============
// TO DO:
//      Verify that the participant ID parameter is being handled appropriately. 
//===============
const urlParams = new URLSearchParams(window.location.search);
let participantID = urlParams.get("participant");
let sessionNum = urlParams.get("session");
let dayNum = urlParams.get("day");

if (participantID) jsPsych.data.addProperties({ participant: participantID})
if (sessionNum) jsPsych.data.addProperties({ session: sessionNum});
if (dayNum) jsPsych.data.addProperties({ day: dayNum });

// Initialize Pavlovia session
if (RUN_ON_PAVLOVIA) {
    timeline.push({
        type: jsPsychPavlovia,
        command: "init",
    });
}

timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: true,
})

timeline.push({ type: jsPsychPreload, images: [] });

// Trial sequence
const conditionCode = randChoice([1, -1]); // 1 = Parity left/Magnitude right; -1 Magnitude left/Parity right
const ruleMapping = (conditionCode === 1) ? {
    even: 'a', // Left Parity
    odd: 'l',
    less: 'l', // Magnitude Right
    greater: 'a',
    code: 1
} : {
    even: 'l', // Parity Right
    odd: 'a',
    less: 'a', // Magnitude Left
    greater: 'l',
    code: -1
};

jsPsych.data.addProperties( { rule_mapping: ruleMapping});

// Link key press to rule
const leftKey = "A";
const rightKey = "L";
const leftParity = ruleMapping.even === 'a' ? 'Even' : 'Odd';
const rightParity = ruleMapping.even === 'a' ? 'Odd' : 'Even';

const leftMag = ruleMapping.less === 'a' ? 'Less than 5' : 'Greater than 5';
const rightMag = ruleMapping.less === 'a' ? 'Greater than 5' : 'Less than 5';

// Generate trial info from primary task file (task.js)
const practiceData = generatePrac(ruleMapping);
const { blocks } = generateExp(ruleMapping);
console.log("Current ruleMapping structure:", ruleMapping);
// Give instructions
timeline.push({
    type: jsPsychInstructions,
    css_classes: ["tswitch-instructions"],
    pages: [
        `<p>On every trial you will see a number surrounded by a colored square, and
            you will judge the number according to one of two rules:</p>
        <ul>
            <li><b><span style="color: #ff4d4d; font-weight: bold;">Parity (Red Box)</span>:</b> Respond to whether the number of EVEN or ODD. 
            <li><b><span style="color: #4d84ff; font-weight: bold;">Magnitude (Blue Box)</span>:</b> Respond to whether the number is GREATER THAN 5 or LESS THAN 5.
        </ul>
        <p>The square's color tells you which rule to use on that trial. The rule can change from one
            trial to the next, so pay attention to the color every time.</p>`,

        `<p>For you, the response keys are:</p>
        <p style="font-size:22px">
            <span class="tswitch-key">A</span> = ${ruleMapping.even === 'a' ? 'Even' : 'Odd'} &nbsp;/&nbsp; ${ruleMapping.less === 'a' ? 'Less than 5' : 'Greater than 5'}<br><br>
            <span class="tswitch-key">L</span> = ${ruleMapping.even === 'l' ? 'Even' : 'Odd'} &nbsp;/&nbsp; ${ruleMapping.less === 'l' ? 'Less than 5' : 'Greater than 5'}
        </p>
        <p>Respond as quickly and accurately as you can. You will have 1.5 seconds to respond on each trial.</p>`,

        `<p>You will get a chance to rest between blocks of trials.</p>`
    ],
    show_clickable_nav: true,
});

// Give participant practice trials sourced in task.js
const practiceLoop = createPracticeLoop(practiceData);
timeline.push(practiceLoop)

// Build task timeline
//const cue_hex = { Red: "#ff4d4d", Blue: "#4d84ff" };

function buildStimulusHTML(trialData) {
    const hex = cue_hex[trialData.cue_color];
    return `
        <div id="tswitch-stim-wrap">
            <div id="tswitch-cue" style="border-color:${hex};"></div>
            <div id="tswitch-num">${trialData.stimulus}</div>
        </div>`;
}

// Fatigue effects are expected, shuffle block presentation to mitigate bias
const shuffledBlocks = jsPsych.randomization.shuffle(blocks);

shuffledBlocks.forEach((blockTrials, blockIdx) => {

    // Identify current block ID
    const currentBlockID = blockTrials[0].block;

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
            const blockHeader = blockIdx === 0
                // If more blocks are scheduled, remind participant of rule-key mapping
                ? `<p>You are about to start a block of trials.</p>
                    <p>Press the SPACE bar when you are ready to begin.</p>`

                : `<p>You are about to start the next block of trials.</p>
                    <p>Press the SPACE bar when you are ready to begin.</p>`;

                return `
                    ${blockHeader}
                    <p><b> Rule Reminder:</b></p>
                    <p>For you, the response keys are:</p>
                    <p style="font-size:22px">
                        <span class="tswitch-key">A</span> = ${ruleMapping.even === 'a' ? 'Even' : 'Odd'} &nbsp;/&nbsp; ${ruleMapping.less === 'a' ? 'Less than 5' : 'Greater than 5'}<br><br>
                        <span class="tswitch-key">L</span> = ${ruleMapping.even === 'l' ? 'Even' : 'Odd'} &nbsp;/&nbsp; ${ruleMapping.less === 'l' ? 'Less than 5' : 'Greater than 5'}
                    </p>
                    <p>Press the SPACE bar when you are ready to begin.</p>
                    `;
        },
        choices: [ " " ],
    });

    // Produce ITI array between 1200 and 1500 ms, in steps of 50ms
    var possible_iti = [];
    let iti = 1200;
    while (iti <= 1500) {
        possible_iti.push(iti);
        iti += 50;
    }
    // Each block will have a randomized ITI and fixation duration
    var ITI_MS = jsPsych.randomization.sampleWithReplacement(possible_iti, ntrials_per_block)
    
    blockTrials.forEach((trialData, t) => {
        // Fixation trial
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="font-size:60px;">+</div>',
            choices: "NO_KEYS",
            trial_duration: FIXATION_MS,
        });

        // Task trial
        timeline.push({
            type: jsPsychCanvasKeyboardResponse,
            canvas_size: [250, 400],
            stimulus: function(canvas) {
                drawTaskStimulus(canvas, trialData);
            },
            choices: ["a", "l"], 
            trial_duration: TRIAL_DURATION_MS,
            response_ends_trial: true,
            data: {
                task: "cued_task_switch",
                block: trialData.block,
                trial: trialData.trial,
                rule: trialData.rule,
                cue_color: trialData.cue_color,
                congruency: trialData.congruency,
                switch_type: trialData.switch_type,
                stimulus_number: trialData.stimulus,
                correct_response: trialData.correct_response,
                rule_mapping: ruleMapping,
                iti_duration: ITI_MS[t], // must save ITI for evaluation
            },
            on_finish: function (data) { // removed function(data)
                data.correct = data.response == data.correct_response;
                data.no_response = data.response === null;
            }
        });

        // ITI + Feedback
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function () {
                var prev_trial = jsPsych.data.get().last(1).values()[0];

                if (prev_trial.no_response) {
                    return '<div style="font-size: 60px; color: orange; font-weight: bold;">Too Slow!</div>';
                } else if (prev_trial.correct) {
                    return '<div style="font-size: 60px; color: green; font-weight: bold;">Correct</div>';
                } else {
                    return '<div style="font-size: 60px; color: red; font-weight: bold;">Incorrect</div>';
                }
            },
            choices: "NO_KEYS",
            trial_duration: ITI_MS[t], // sample from the random ITI array generated at the start of this block
            data: {
                task: "iti_feedback",
                block: trialData.block,
                trial: trialData.trial,
            }
        });
    });

    // End of block --- COMMENTING OUT TO TEST NEW PROC TO PRESENT PERFORMANCE FEEDBACK
    //timeline.push({
    //    type: jsPsychHtmlKeyboardResponse,
    //    stimulus: 
    //        blockIdx < blocks.length - 1
    //        ? `<p>You just completed a block of trials. You may take a moment to rest.</p>
    //            <p>Press SPACE when you are ready to continue.</p>`
    //        : `<p>You have completed all blocks. Press SPACE for further instructions.</p>`,
    //    choices: [ " " ],
    //});

    // End of block (with performance feedback for possible exclusion from study)
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
            // Get data from the most recent block of trials
            const lastBlockData = jsPsych.data.get().filter({
                task: "cued_task_switch",
                block: currentBlockID
            });

            // Checking if participants met exclusion criteria
            if (checkPoorPerform(lastBlockData)) {
                return `
                    <div style="font-size: 24px; color: red;">
                        <h2>End of experiment</h2>
                        <p>We are ending the experiment based on your responses on the previous block.</p>
                        <br>
                        <p>Press SPACE to exit.</p>
                    </div>`;
            }
            // Let participant continue if performance was good
            if (blockIdx < blocks.length - 1) {
                return `<p>You just completed a block of trials. You may take a moment to rest.</p>
                        <p>Press SPACE when you are ready to continue.</p>`;
            } else {
                return `<p>You have completed all blocks. Press SPACE for further instructions.</p>`
            }
        },
        choices: [" "],
        on_finish: function() {
            // Collect data
            const lastBlockData = jsPsych.data.get().filter({
                task: "cued_task_switch",
                block: currentBlockID
            });

            if (checkPoorPerform(lastBlockData)) {
                jsPsych.endExperiment("The experiment is ending due to your responses.")
            }
        }
    });
});

// TO DO:
//      Build a redirect system to take participants back to SONA after the completion of the study

// End the experiement for good performers
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<p>This is the end of the task. This was first part of the experiment. 
        Please check your email in 24 hours to complete the second part. You must complete
        the second part within 3 days (72 hours). As a reminder, you must complete both 
        parts to receive course credit AND to be eligible for the $100 lottery.</p>`,
    command: "finish",
    on_finish: function() {
        jsPsych.data.get().localSave('csv','/Users/nilcamp2/Library/CloudStorage/Box-Box/NILCAMP/Studies/Cognitive Architecture/Task/mydata.csv')
    }
});

timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: false,
});


// For when the task is run on Pavlovia
if (RUN_ON_PAVLOVIA) {
    timeline.push({
        type: jsPsychPavlovia,
        command: "finish",
    })
}

// Save data on Pavlovia
var pavlovia_finish = {
    type: "pavlovia",
    command: "finish",
    on_finish: function() {
        document.body.innerHTML = '<p> Please wait. You will be redirected back to SONA in a few moments. If you get a pop up warning you "data may not be saved", you can click "leave". Your data has already been saved.</p>'
    }
}; 
timeline.push(pavlovia_finish);

jsPsych.run(timeline);


</script>
</html>
